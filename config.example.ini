; MediaFormat - configuracion de ejemplo
; Copia este archivo a %APPDATA%\MediaFormat\config.ini si quieres editarlo a mano.
; Los comentarios deben ocupar una linea completa (no se admiten comentarios al final).
; Rutas: admite variables de entorno (%USERPROFILE%) y ~.

[app]
; system | light | dark
theme = system
; system | blue | red | green | yellow | purple | pink | brown
accent = blue
; es | en (se aplica al reiniciar)
language = es
; Notificacion nativa al terminar un lote
notify_on_finish = true
; Recuperar la cola de archivos al volver a abrir
restore_queue = true
version = 2

[output]
; Carpeta donde se guardan las conversiones (por defecto Documents\MediaFormat)
folder = %USERPROFILE%\Documents\MediaFormat
; true para abrir la carpeta al terminar un lote
open_after_convert = false
; rename | overwrite | skip
on_conflict = rename

[format]
; Formato por defecto: JPEG, PNG, WEBP, BMP, TIFF, GIF, ICO, TGA, AVIF
default = WEBP

[jpeg]
quality = 95
; 4:4:4 | 4:2:2 | 4:2:0
subsampling = 4:2:0
; Color de fondo al aplanar transparencia (#RRGGBB)
background = #FFFFFF

[webp]
quality = 95
lossless = false

[png]
; 0 (rapido) - 9 (maxima compresion)
compress_level = 6

[processing]
keep_metadata = true
apply_exif_orientation = true
max_workers = 4
recursive_folders = true
animated_frames = false

[ui]
thumbnails = true
; Tamano recordado (Ancho x Alto). Vacio = 70 % de la pantalla.
window_geometry =
; Posicion antigua: se ignora, la ventana siempre se abre centrada.
window_x = -1
window_y = -1
window_maximized = false

[profiles]
; Perfiles personalizados: clave = JSON generado por la aplicacion.
; Ejemplo:
; mi-perfil = {"output_format": "JPEG", "quality": 85, "lossless": false}
